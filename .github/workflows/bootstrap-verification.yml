#
# One-shot bootstrap for Gradle dependency verification: resolves the full
# dependency graph and writes gradle/verification-metadata.xml (sha256 checksums),
# then commits it. Run manually whenever dependencies change:
#
#   gh workflow run bootstrap-verification.yml --repo dwicao/AuroraStore
#
# or locally (needs network to Maven Central/Google):
#
#   ./gradlew --write-verification-metadata sha256 assembleVanillaRelease \
#       testVanillaDebugUnitTest
#
# Once gradle/verification-metadata.xml exists, every build verifies artifact
# checksums, so a silently swapped upstream artifact fails the build instead of
# shipping. Coverage note: this resolves the vanilla debug+release graphs (what
# CI builds). Building another flavor (e.g. huawei) with new, unlisted artifacts
# will fail verification until the metadata is regenerated to include them.

name: Bootstrap dependency verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Accepts all SDK licenses; AGP auto-downloads whatever else the build needs.
          packages: 'platform-tools'

      - name: Generate verification metadata
        run: |
          chmod +x gradlew
          ./gradlew --write-verification-metadata sha256 \
            assembleVanillaRelease testVanillaDebugUnitTest --stacktrace

      - name: Commit verification metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "verification metadata unchanged"
            exit 0
          fi
          git commit -m "CI: refresh Gradle dependency verification metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
