#
# Builds a signed release APK and uploads it to the GitHub Release.
#
# Triggers:
#   - push a tag like `v4.8.5`  -> builds + creates/updates that GitHub Release
#   - manual "Run workflow"      -> builds + uploads as a workflow artifact
#     (set `upload_to_release` to true to also publish to the latest release)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64 : base64 of your release keystore (`base64 -w0 release.jks`)
#   KEY_ALIAS               : key alias inside the keystore
#   KEY_PASSWORD            : key password (also used as store password, matching
#                             app/build.gradle.kts `signing.properties` format)
#
# Optional:
#   KEYSTORE_FILE_NAME      : file name to restore the keystore as (default: release.keystore)
#
# If the secrets are absent the workflow still builds `assembleVanillaRelease`
# unsigned (Gradle skips the release signingConfig when signing.properties is missing)
# so you can test the pipeline before adding signing keys.

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor to build"
        required: false
        default: "vanilla"
        type: choice
        options:
          - vanilla
          - huawei
          - preload
      upload_to_release:
        description: "Also upload to the latest GitHub Release?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ inputs.flavor || 'vanilla' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: build.gradle.kts derives version suffixes from `git log`.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_NAME: ${{ secrets.KEYSTORE_FILE_NAME || 'release.keystore' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "app/${KEYSTORE_NAME}"
          {
            echo "STORE_FILE=${KEYSTORE_NAME}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } > app/signing.properties
          echo "signing.properties created for alias '${KEY_ALIAS}'"

      - name: Warn on missing signing secrets
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building unsigned release APK for pipeline testing."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          set -euo pipefail
          FLAVOR_LOWER="$(echo "${FLAVOR}" | tr '[:upper:]' '[:lower:]')"
          # Task names are e.g. assembleVanillaRelease
          FLAVOR_TITLE="$(echo "${FLAVOR_LOWER}" | sed -E 's/(^|_)([a-z])/\U\2/g')"
          ./gradlew "assemble${FLAVOR_TITLE}Release" --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          FLAVOR_LOWER="$(echo "${FLAVOR}" | tr '[:upper:]' '[:lower:]')"
          APK_DIR="app/build/outputs/apk/${FLAVOR_LOWER}/release"
          echo "Listing ${APK_DIR}:"
          ls -lh "${APK_DIR}"
          APK_PATH="$(ls "${APK_DIR}"/app-"${FLAVOR_LOWER}"-release.apk | head -n1)"
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "APK: ${APK_PATH}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-store-${{ env.FLAVOR }}-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Tag pushes -> attach the signed APK to that GitHub Release.
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      # Manual runs with upload_to_release=true -> attach to the latest release instead.
      - name: Upload to latest Release (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
