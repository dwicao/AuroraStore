#
# Builds a signed release APK and uploads it to the GitHub Release.
#
# Triggers:
#   - push a tag like `v4.8.5`  -> builds + creates/updates that GitHub Release
#   - manual "Run workflow"      -> builds + uploads as a workflow artifact
#     (set `upload_to_release` to true to also publish to the latest release)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64 : base64 of your release keystore (`base64 -w0 release.jks`)
#   KEY_ALIAS               : key alias inside the keystore
#   KEY_PASSWORD            : key password (also used as store password, matching
#                             app/build.gradle.kts `signing.properties` format)
#
# Optional:
#   KEYSTORE_FILE_NAME      : file name to restore the keystore as (default: release.keystore)
#
# If the secrets are absent the workflow still builds `assembleVanillaRelease`
# unsigned (Gradle skips the release signingConfig when signing.properties is missing)
# so you can test the pipeline before adding signing keys.

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor to build"
        required: false
        default: "vanilla"
        type: choice
        options:
          - vanilla
          - huawei
          - preload
      upload_to_release:
        description: "Also upload to the latest GitHub Release?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: build.gradle.kts derives version suffixes from `git log`.
          fetch-depth: 0

      - name: Resolve flavor
        id: flavor
        run: |
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ]; then FLAVOR="vanilla"; fi
          FLAVOR_LOWER="$(echo "$FLAVOR" | tr '[:upper:]' '[:lower:]')"
          FLAVOR_TITLE="$(echo "$FLAVOR_LOWER" | sed -E 's/(^|_)([a-z])/\U\2/g')"
          echo "lower=${FLAVOR_LOWER}" >> "$GITHUB_OUTPUT"
          echo "title=${FLAVOR_TITLE}" >> "$GITHUB_OUTPUT"
          echo "Flavor: ${FLAVOR_LOWER} (task: assemble${FLAVOR_TITLE}Release)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the long-removed `tools` package, which makes
          # sdkmanager exit 1 — so pin an installable package explicitly. This
          # accepts all SDK licenses; AGP then auto-downloads whatever else the
          # build needs (platform android-37, build-tools) during the Gradle run.
          # NOTE: single YAML quotes — doubles would be passed literally to
          # sdkmanager as part of the package name. `platforms;android-37`
          # must NOT be listed here: it is not published in the sdkmanager repo
          # and AGP resolves it on its own.
          packages: 'platform-tools'

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_NAME: ${{ secrets.KEYSTORE_FILE_NAME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building unsigned release APK for pipeline testing."
            exit 0
          fi
          if [ -z "${KEYSTORE_NAME}" ]; then KEYSTORE_NAME="release.keystore"; fi
          echo "${KEYSTORE_B64}" | base64 --decode > "app/${KEYSTORE_NAME}"
          # NOTE: app/build.gradle.kts checks plain File("signing.properties"), which
          # resolves against the JVM working dir (repo root, where gradlew runs),
          # while storeFile = file(...) resolves against the app/ module dir.
          # So the properties file must exist at the repo root, with STORE_FILE
          # expressed relative to app/. A copy is also placed in app/ for good
          # measure (e.g. when Gradle is invoked from inside app/).
          {
            echo "STORE_FILE=${KEYSTORE_NAME}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } > signing.properties
          cp signing.properties app/signing.properties
          echo "signing.properties created for alias '${KEY_ALIAS}'"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          # Optional: a personal Exodus API token. Empty/absent falls back to the
          # bundled shared key (see app/build.gradle.kts); a dead bundled key only
          # degrades the tracker-report UI, never auth or downloads.
          EXODUS_API_KEY: ${{ secrets.EXODUS_API_KEY }}
        run: ./gradlew "assemble${{ steps.flavor.outputs.title }}Release" --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          FLAVOR_LOWER="${{ steps.flavor.outputs.lower }}"
          APK_DIR="app/build/outputs/apk/${FLAVOR_LOWER}/release"
          echo "Listing ${APK_DIR}:"
          ls -lh "${APK_DIR}"
          if [ -f "${APK_DIR}/app-${FLAVOR_LOWER}-release.apk" ]; then
            APK_PATH="${APK_DIR}/app-${FLAVOR_LOWER}-release.apk"
          else
            echo "::error::Signed APK not found — the build produced an unsigned APK. signing.properties was not picked up; check the keystore restore step."
            ls -lh "${APK_DIR}"
            exit 1
          fi
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "APK: ${APK_PATH}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-store-${{ steps.flavor.outputs.lower }}-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Tag pushes -> attach the signed APK to that GitHub Release.
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      # Manual runs with upload_to_release=true -> attach to the latest release instead.
      - name: Upload to latest Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}

  # Keeps updates.json (the in-app self-update feed) in sync with the release that
  # was just published: version from the tag, versionCode from that tag's
  # build.gradle.kts, size + sha256 from the uploaded APK, changelog from the
  # release notes. Runs only for tag releases; pushing to master triggers no other
  # workflow, so this cannot loop.
  update-feed:
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Refresh updates.json from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Wait for the release asset (uploaded by the build job above).
          for i in $(seq 1 20); do
            ASSET_URL="$(gh release view "$TAG" --repo "$REPO" --json assets \
              --jq '.assets[] | select(.name | endswith(".apk")) | .url' | head -n1 || true)"
            if [ -n "$ASSET_URL" ]; then break; fi
            echo "waiting for release asset... ($i)"
            sleep 30
          done
          if [ -z "${ASSET_URL:-}" ]; then
            echo "::error::no APK asset found on release $TAG"
            exit 1
          fi
          gh release download "$TAG" --repo "$REPO" --pattern "*.apk" --dir /tmp/feed-apk
          APK="$(ls /tmp/feed-apk/*.apk | head -n1)"
          APK_NAME="$(basename "$APK")"
          SIZE="$(stat -c%s "$APK")"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          VERSION_CODE="$(git show "$TAG:app/build.gradle.kts" \
            | grep -oE 'versionCode = [0-9]+' | grep -oE '[0-9]+' | head -n1)"
          VERSION_NAME="${TAG#v}"
          BODY="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          python3 - "$TAG" "$VERSION_NAME" "$VERSION_CODE" "$SIZE" "$SHA256" "$BODY" "$APK_NAME" <<'EOF'
          import json, sys
          tag, version_name, version_code, size, sha256, body, apk_name = sys.argv[1:8]
          feed = {
              "version_name": version_name,
              "version_code": version_code,
              "download_url": f"https://github.com/dwicao/AuroraStore/releases/download/{tag}/{apk_name}",
              "icon_url": "",
              "sha1": "",
              "sha256": sha256,
              "changelog": body.strip() or f"Changelog : {tag} (fork)",
              "size": size,
              "last_commit": "",
              "updated_on": "",
              "timestamp": "0",
          }
          with open("updates.json", "w") as f:
              json.dump(feed, f, indent = 2, ensure_ascii = False)
              f.write("\n")
          print(f"updates.json refreshed for {tag} (code {version_code}, {size} bytes)")
          EOF

      - name: Commit refreshed feed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "updates.json unchanged"
            exit 0
          fi
          git commit -m "Feed ${{ github.ref_name }} (auto-updated from release)"
          git pull --rebase origin master
          git push origin HEAD:master
